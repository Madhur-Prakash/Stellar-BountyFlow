[workspace]
resolver = "2"
members = ["bounty_escrow", "attestations", "web_auth"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
soroban-sdk = "28.0.0"

# Release profile tuned for Soroban: small, deterministic wasm with overflow checks kept on.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Convenience profile for building with logs enabled (e.g. `--profile release-with-logs`).
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
