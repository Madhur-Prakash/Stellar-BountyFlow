[project]
name = "bountyflow-api"
version = "0.1.0"
description = "BountyFlow API — Stellar/Soroban bounty marketplace backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.189.0",
    "google-auth>=2.42.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "logifyx>=2.0.0",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "stellar-sdk[aiohttp]>=16.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    # Only scripts/mint_gmail_token.py runs an OAuth consent flow; the server never does.
    "google-auth-oauthlib>=1.2.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[project.scripts]
bountyflow-worker = "worker.main:run"
bountyflow-seed = "app.scripts.seed:run"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["S101", "B008", "RUF012", "S105", "S106", "E501", "N818", "ASYNC109", "RUF001", "RUF002", "RUF003", "SIM105", "C416", "UP047", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "PT011", "PT018"]
"app/scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL (TEST_DATABASE_URL)",
  "testnet: requires Stellar Testnet access and a funded identity (opt-in)",
]
filterwarnings = ["ignore::DeprecationWarning:aiokafka.*"]
